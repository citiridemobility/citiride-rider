name: citiride
description: "Ride-hailing rider app for citiride."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cloud_firestore: ^6.6.0
  cloud_functions: ^6.3.3
  cupertino_icons: ^1.0.8
  firebase_auth: ^6.5.4
  firebase_core: ^4.11.0
  firebase_messaging: ^16.4.1
  firebase_storage: ^13.4.3
  go_router: ^17.3.0
  flutter_svg: ^2.3.0
  share_plus: ^13.2.1
  google_maps_flutter: ^2.17.1
  google_maps_flutter_android: ^2.19.12
  google_maps_flutter_platform_interface: ^2.16.0
  geolocator: ^14.0.3
  http: ^1.6.0
  path_provider: ^2.1.6
  uuid: ^4.6.0
  web: ^1.1.1
  image_picker: 1.2.1
  shared_preferences: ^2.5.5
  geocoding: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/home_default_map.png
    - assets/icons/
    - assets/images/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-BoldItalic.ttf
          weight: 700
          style: italic
